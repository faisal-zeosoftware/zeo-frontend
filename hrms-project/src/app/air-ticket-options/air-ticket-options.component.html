<div class="sub-sidebar clickOutside">
  <mat-sidenav-container class="sub-sidenav-container">
    <mat-sidenav
      #sidenav
      class="sub-sidenav hide-scrollbar"
      [opened]="isMobile ? isMenuOpen : true"
      [mode]="isMobile ? 'over' : 'side'"
      (closedStart)="isMenuOpen = false"
    >
      <div class="wrapper">

        <div class="sidebar-top">
          <span class="sub-sidebar-title" *ngIf="isMenuOpen">Air Ticket Options</span>
          <button type="button" class="btn-collapse" (click)="toggleSidebarMenu()" aria-label="Toggle Navigation">
            <mat-icon>{{ isMenuOpen ? 'chevron_left' : 'menu' }}</mat-icon>
          </button>
        </div>

        <nav class="sidebar hide-scrollbar" [class.menu-open]="isMenuOpen" [class.menu-close]="!isMenuOpen">
          <ul class="nav-menu-list">

            <li *ngIf="hasViewPermissionAirticketPolicy">
              <a routerLink="/main-sidebar/air-ticket-options/air-ticket-policy" routerLinkActive="active-link" class="nav-item-link" (click)="closeOnMobile()">
                <mat-icon class="nav-icon">policy</mat-icon>
                <span class="sidenav-opt">Airticket Policy</span>
              </a>
            </li>

            <li *ngIf="hasViewPermissionAirticketApprovals">
              <a routerLink="/main-sidebar/air-ticket-options/airticket-approvals" routerLinkActive="active-link" class="nav-item-link" (click)="closeOnMobile()">
                <mat-icon class="nav-icon">fact_check</mat-icon>
                <span class="sidenav-opt">Airticket Approvals</span>
              </a>
            </li>

            <li *ngIf="hasViewPermissionAirticketAllocation">
              <a routerLink="/main-sidebar/air-ticket-options/airticket-allocation" routerLinkActive="active-link" class="nav-item-link" (click)="closeOnMobile()">
                <mat-icon class="nav-icon">confirmation_number</mat-icon>
                <span class="sidenav-opt">Airticket Allocation</span>
              </a>
            </li>

            <li *ngIf="hasViewPermissionAirticketRule">
              <a routerLink="/main-sidebar/air-ticket-options/airticket-rule" routerLinkActive="active-link" class="nav-item-link" (click)="closeOnMobile()">
                <mat-icon class="nav-icon">gavel</mat-icon>
                <span class="sidenav-opt">Airticket Rule</span>
              </a>
            </li>

            <li *ngIf="hasViewPermissionAirticketEsc">
              <a routerLink="/main-sidebar/air-ticket-options/airticket-escalation" routerLinkActive="active-link" class="nav-item-link" (click)="closeOnMobile()">
                <mat-icon class="nav-icon">report_problem</mat-icon>
                <span class="sidenav-opt">Airticket Escalation</span>
              </a>
            </li>

            <li *ngIf="hasViewPermissionAirticketAprlvl">
              <a routerLink="/main-sidebar/air-ticket-options/airticket-approval-level" routerLinkActive="active-link" class="nav-item-link" (click)="closeOnMobile()">
                <mat-icon class="nav-icon">layers</mat-icon>
                <span class="sidenav-opt">Airticket Approval Level</span>
              </a>
            </li>

            <li *ngIf="hasViewPermissionAirticketRequest">
              <a routerLink="/main-sidebar/air-ticket-options/airticket-request" routerLinkActive="active-link" class="nav-item-link" (click)="closeOnMobile()">
                <mat-icon class="nav-icon">flight_takeoff</mat-icon>
                <span class="sidenav-opt">Airticket Request</span>
              </a>
            </li>

          </ul>
        </nav>

      </div>
    </mat-sidenav>

    <main class="sub-content-area">
      <button
        type="button"
        class="mobile-submenu-fab"
        *ngIf="isMobile && !isMenuOpen"
        (click)="toggleSidebarMenu()"
        aria-label="Open submenu">
        <mat-icon>menu</mat-icon>
      </button>

      <router-outlet></router-outlet>
    </main>

  </mat-sidenav-container>
</div>
