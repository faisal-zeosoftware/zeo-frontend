<div class="container" *ngIf="hasViewPermission">
    <div class="comapny_section">

        <div class="com_list mt-4">
            <div class="cpm-sec shadow-sm p-4 bg-white rounded">
                <h2>Employee Recheck</h2>
                <p class="text-muted small">Send an attendance recheck email to the selected employee.</p>
                <hr>
                
                <div class="row align-items-end">
                  <div class="col-md-6">
                    <label class="font-weight-bold">Select Employee</label>
                    <div class="custom-sel">
                      <div class="form-control-wrapper">
                      
  <mat-form-field appearance="outline" class="w-100">
    <mat-select
      [(ngModel)]="selectedEmployeeCode"
      [ngModelOptions]="{standalone:true}"
      placeholder="Select Employee"
      (closed)="employeeSearch=''"
    >

      <div class="px-2 pb-2">
        <input
          type="text"
          class="form-control"
          placeholder="Search Employee"
          [(ngModel)]="employeeSearch"
          [ngModelOptions]="{standalone:true}"
          (click)="$event.stopPropagation()"
          (keydown)="$event.stopPropagation()"
        />
      </div>

      <mat-option
        *ngFor="let employee of filterEmployees()"
        [value]="employee.id"
      >
        {{ employee.emp_code }}
      </mat-option>

    </mat-select>
  </mat-form-field>
  </div>

                    </div>
                  </div>
              
                  <div class="col-md-3">
                    <button class="form-control btn btn-primary w-100 d-flex align-items-center justify-content-center" 
                            (click)="SendEmployeeRecheck()" 
                            [disabled]="isLoading || !selectedEmployeeCode">
                      
                      <ng-container *ngIf="!isLoading">
                        <mat-icon class="mr-1">send</mat-icon> Send
                      </ng-container>
              
                      <ng-container *ngIf="isLoading">
                        <span class="spinner-border spinner-border-sm mr-2" role="status" aria-hidden="true"></span>
                        Sending...
                      </ng-container>
                    </button>
                  </div>
                </div>
              </div>
           
          </div>



    </div>
</div>


                                      <!-- Loader -->
    <div class="loader-container" [class.show]="isLoading">
      <div class="loader"></div>
    </div>
