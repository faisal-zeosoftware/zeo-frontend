<div class="sub-sidebar clickOutside">
  <mat-sidenav-container class="sub-sidenav-container">
    <mat-sidenav
      #sidenav
      class="sub-sidenav hide-scrollbar"
      [opened]="isMobile ? isMenuOpen : true"
      [mode]="isMobile ? 'over' : 'side'"
      (closedStart)="isMenuOpen = false"
    >
      <div class="wrapper">

        <div class="sidebar-top">
          <span class="sub-sidebar-title" *ngIf="isMenuOpen">Asset Options</span>
          <button type="button" class="btn-collapse" (click)="toggleSidebarMenu()" aria-label="Toggle Navigation">
            <mat-icon>{{ isMenuOpen ? 'chevron_left' : 'menu' }}</mat-icon>
          </button>
        </div>

        <nav class="sidebar hide-scrollbar" [class.menu-open]="isMenuOpen" [class.menu-close]="!isMenuOpen">
          <ul class="nav-menu-list">

            <li *ngIf="hasViewPermissionAssetTypes">
              <a routerLink="/main-sidebar/asset-options/asset-type" routerLinkActive="active-link" class="nav-item-link" (click)="closeOnMobile()">
                <mat-icon class="nav-icon">category</mat-icon>
                <span class="sidenav-opt">Asset Types</span>
              </a>
            </li>

            <li *ngIf="hasViewPermissionAssetMaster">
              <a routerLink="/main-sidebar/asset-options/asset-master" routerLinkActive="active-link" class="nav-item-link" (click)="closeOnMobile()">
                <mat-icon class="nav-icon">inventory_2</mat-icon>
                <span class="sidenav-opt">Asset Master</span>
              </a>
            </li>

            <li *ngIf="hasViewPermissionAssetApprovals">
              <a routerLink="/main-sidebar/asset-options/asset-approval" routerLinkActive="active-link" class="nav-item-link" (click)="closeOnMobile()">
                <mat-icon class="nav-icon">verified</mat-icon>
                <span class="sidenav-opt">Asset Approvals</span>
              </a>
            </li>

            <li *ngIf="hasViewPermissionAssetEsc">
              <a routerLink="/main-sidebar/asset-options/asset-escalation" routerLinkActive="active-link" class="nav-item-link" (click)="closeOnMobile()">
                <mat-icon class="nav-icon">trending_up</mat-icon>
                <span class="sidenav-opt">Asset Escalation</span>
              </a>
            </li>

            <li *ngIf="hasViewPermissionAssetAllocation">
              <a routerLink="/main-sidebar/asset-options/asset-allocation" routerLinkActive="active-link" class="nav-item-link" (click)="closeOnMobile()">
                <mat-icon class="nav-icon">assignment_ind</mat-icon>
                <span class="sidenav-opt">Asset Allocation</span>
              </a>
            </li>

            <li *ngIf="hasViewPermissionAssetAprlvl">
              <a routerLink="/main-sidebar/asset-options/asset-approvel-level" routerLinkActive="active-link" class="nav-item-link" (click)="closeOnMobile()">
                <mat-icon class="nav-icon">approval</mat-icon>
                <span class="sidenav-opt">Asset Approval Level</span>
              </a>
            </li>

            <li *ngIf="hasViewPermissionAssetRequest">
              <a routerLink="/main-sidebar/asset-options/asset-request" routerLinkActive="active-link" class="nav-item-link" (click)="closeOnMobile()">
                <mat-icon class="nav-icon">request_quote</mat-icon>
                <span class="sidenav-opt">Asset Request</span>
              </a>
            </li>

          </ul>
        </nav>

      </div>
    </mat-sidenav>

    <main class="sub-content-area">
      <button
        type="button"
        class="mobile-submenu-fab"
        *ngIf="isMobile && !isMenuOpen"
        (click)="toggleSidebarMenu()"
        aria-label="Open submenu">
        <mat-icon>menu</mat-icon>
      </button>

      <router-outlet></router-outlet>
    </main>

  </mat-sidenav-container>
</div>
