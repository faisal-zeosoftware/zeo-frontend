<div mat-dialog-content class="">

    <div class="cpm-sec" *ngIf="Emp" >

                <div class="pull-right">
    <!-- Styled Square Close Button -->
    <span class="close-btn" (click)="ClosePopup()">
      ×
    </span>
  </div>  
  
        <h1>Branch Details Edit</h1><hr>
  
        <form enctype="multipart/form-data">
           <div class="row">

            <div class="col-md-6" >
                     
                <label>Branch Code</label>
               <input type="text"  class="form-control" required id="branch_code" name="branch_code"  [(ngModel)]="Emp.branch_code"  placeholder="Enter Branch Code"
                [ngModelOptions]="{standalone: true}" [ngClass]="{'error-field': registerButtonClicked && !branch_code}">
               
               <div *ngIf="registerButtonClicked && !branch_code" class="error-message">Branch code is required.</div>
          </div>
          
            <div class="col-md-6" >
                     
              <label>Branch Name</label>
             <input type="text"  class="form-control" required id="branch_name" name="branch_name"  [(ngModel)]="Emp.branch_name"  placeholder="Enter Branch Name"
              [ngModelOptions]="{standalone: true}" [ngClass]="{'error-field': registerButtonClicked && !branch_name}">
             
             <div *ngIf="registerButtonClicked && !branch_name" class="error-message">Branch Name is required.</div>
        </div>

      
    <div class="col-md-6">
        <div class="custom-sel">
          <label>Country</label>
          <select class="form-control" id="country" required [(ngModel)]="br_country" (change)="onCountryChange()" [ngModelOptions]="{standalone: true}">
            <option value="">Select</option>
            <option *ngFor="let country of countries" [value]="country.id">{{ country.country_name }}</option>
          </select>
        </div>
      </div>

            <!-- Dynamic State Section -->
      <div class="col-md-6" *ngIf="states && states.length > 0">
        <div class="custom-sel">
          <!-- Dynamically displaying the state_label from the API response -->
          <label>{{ state_label }}</label>
          <select class="form-control" id="state"  [(ngModel)]="br_state_id" [ngModelOptions]="{standalone:true}">
            <option value="">Select</option>
            <option *ngFor="let state of states" [value]="state.id">{{ state.state_name }}</option>
          </select>
        </div>
      </div>
        
              <div class="col-md-6">
                         
                  
                      <label>City
                      </label>
                      <input type="text" [(ngModel)]="br_city" required [ngModelOptions]="{standalone: true}" class="form-control" placeholder="enter city">
    
                 
          </div>
       
          <div class="col-md-6">
                         
                  
              <label>pincode
              </label>
              <input type="text" [(ngModel)]="br_pincode" required [ngModelOptions]="{standalone: true}"  class="form-control" placeholder="enter Branch pincode">
    
          
          </div>
    
          <div class="col-md-6">
                         
                  
              <label>Email
              </label>
              <input type="text" [(ngModel)]="br_branch_mail" required [ngModelOptions]="{standalone: true}" class="form-control" placeholder="enter email id">
    
         
    </div>
        
    
    
    <div class="col-md-6">
                         
                  
      <label>Company number 1</label>
      <input type="text" [(ngModel)]="br_branch_nmbr_1" required [ngModelOptions]="{standalone: true}"  class="form-control" placeholder="enter Contact number" >
    
    
    </div>
        

    <div class="col-md-6">
                         
                  
    <label>Company number 2 (optional)</label>
    <input type="text" [(ngModel)]="br_branch_nmbr_2" required [ngModelOptions]="{standalone: true}"  class="form-control" placeholder="enter Contact number " >
    
    
    </div>
          

    
<div class="col-md-6"> 
  <label for="branch_logo">Branch Logo :</label>

  <div class="custom-file-box" (click)="triggerFileInput()">

    <!-- Show existing file if no new file selected -->
    <span *ngIf="Emp.branch_logo && !selectedFile">
      {{ getFileName(Emp.branch_logo) }}
    </span>

    <!-- Show selected file -->
    <span *ngIf="selectedFile">
      {{ selectedFile.name }}
    </span>

    <i class="fa fa-upload upload-icon"></i>
  </div>

  <!-- Hidden Actual File Input -->
  <input 
      type="file" 
      #fileInput 
      class="hidden-file-input" 
      (change)="onFileSelected($event)">
</div>

        
              
           </div>

           <div class="row">
            <div class="col-md-8"></div>
            <div class="col-md-2">
                <button (click)="ClosePopup()"   class="pull-right btn btn-danger btn-full mt-4" >Cancel</button>
      
            </div>
            <div class="col-md-2">
                <button   mat-raised-button color="primary" class="pull-right btn-full mt-4" type="submit" (click)="updateBranch()" >Update</button>
      
            </div>
        </div>
        </form>
    
  

  
  
        </div>
  </div>
  <div mat-dialog-action>
    
  </div>
