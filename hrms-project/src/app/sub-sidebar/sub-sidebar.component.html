<div class="sub-sidebar clickOutside">
  <mat-sidenav-container class="sub-sidenav-container">
    <mat-sidenav
      class="sub-sidenav hide-scrollbar"
      #sidenav
      [opened]="isMobile ? isMenuOpen : true"
      [mode]="isMobile ? 'over' : 'side'"
      (closedStart)="isMenuOpen = false"
    >
      <div class="wrapper">
        <!-- Compact Sidebar Header -->
        <div class="sidebar-top">
          <span class="sub-sidebar-title" *ngIf="isMenuOpen"><z-app-title fallback="Submenu"></z-app-title></span>
          <button
            type="button"
            class="btn btn-collapse"
            (click)="toggleSidebarMenu()"
            aria-label="Toggle Sub Sidebar"
          >
            <mat-icon class="toggle-icon">
              {{ isMenuOpen ? 'chevron_left' : 'chevron_right' }}
            </mat-icon>
          </button>
        </div>

        <!-- Sidebar Navigation Container -->
        <div
          class="sidebar hide-scrollbar"
          [class.menu-open]="isMenuOpen"
          [class.menu-close]="!isMenuOpen"
        >
          <z-module-menu [open]="isMenuOpen" (picked)="closeOnMobile()"></z-module-menu>
        </div>
      </div>
</mat-sidenav>

    <!-- Content Area -->
   <mat-sidenav-content class="sub-content-area">
          <!-- Mobile-only floating toggle to reopen the submenu -->
      <button
        type="button"
        class="mobile-submenu-fab"
        *ngIf="isMobile && !isMenuOpen"
        (click)="toggleSidebarMenu()"
        aria-label="Open submenu"
      >
        <mat-icon>menu</mat-icon>
      </button>
      
      <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
